name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  safe-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: infidash_test
          POSTGRES_USER: infidash_test
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infidash_test -d infidash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INFIDASH_TEST_DATABASE_URL: postgresql://infidash_test:test-only@127.0.0.1:5432/infidash_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm run test:db

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: infidash_test
          POSTGRES_USER: infidash_test
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infidash_test -d infidash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INFIDASH_TEST_DATABASE_URL: postgresql://infidash_test:test-only@127.0.0.1:5432/infidash_test
      INFIDASH_TEST_API_BASE_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm run test:api
