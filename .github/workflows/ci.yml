name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  safe-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Blocking since audit remediation W5.2: a new high-severity advisory fails the build.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: infidash_test
          POSTGRES_USER: infidash_test
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infidash_test -d infidash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INFIDASH_TEST_DATABASE_URL: postgresql://infidash_test:test-only@127.0.0.1:5432/infidash_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm run test:db
      - name: Apply editorial migrations to the test database (twice, to prove they are idempotent)
        env:
          DATABASE_URL: ${{ env.INFIDASH_TEST_DATABASE_URL }}
        run: |
          npm run db:migrate:editorial
          npm run db:migrate:editorial

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: infidash_test
          POSTGRES_USER: infidash_test
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infidash_test -d infidash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INFIDASH_TEST_DATABASE_URL: postgresql://infidash_test:test-only@127.0.0.1:5432/infidash_test
      INFIDASH_TEST_API_BASE_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm run test:api

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      # Build only (no push): proves the production image still builds from this commit.
      - run: docker build -t infidash:ci .
      # Smoke checks on the runtime image: Node 24, tsx and pg_dump present, no compilers, no devDependencies.
      - run: |
          docker run --rm infidash:ci node --version | grep -E '^v24\.'
          docker run --rm infidash:ci sh -c 'test -x node_modules/.bin/tsx && command -v pg_dump && test ! -e node_modules/typescript && ! command -v g++ && ! command -v make'
          docker image inspect infidash:ci --format '{{.Size}}' | awk '{printf "image size: %.0f MB\n", $1/1048576}'
